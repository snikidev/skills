#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - unzip
  - git
  - build-essential

write_files:
  - path: /opt/openchamber-setup.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail

      # Native node is needed for the OpenChamber server shebang; bun and the
      # opencode CLI are the paths OpenChamber checks in managed remote setup.
      curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      apt-get install -y nodejs

      su - azureuser -c "curl -fsSL https://bun.sh/install | bash"
      su - azureuser -c "curl -fsSL https://opencode.ai/install | bash"

      {
        node --version
        su - azureuser -c "~/.bun/bin/bun --version"
        su - azureuser -c "~/.opencode/bin/opencode --version"
      } > /home/azureuser/openchamber-setup.log 2>&1

      touch /home/azureuser/openchamber-setup.done

runcmd:
  - /opt/openchamber-setup.sh
